name: Format Check

# Runs the ktfmt formatter and ensures the source files do not need formatting.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  format_check:
    name: "Check Kotlin formatting"
    runs-on: ubuntu-26.04
    steps:
      - name: "Check out code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Set up JDK 25"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: "Download ktfmt"
        run: curl -fsSLo ktfmt.jar https://github.com/Kotlin/ktfmt/releases/download/v0.65/ktfmt-0.65-with-dependencies.jar

      - name: "Check formatting"
        run: java -jar ktfmt.jar --dry-run --set-exit-if-changed --kotlinlang-style --enable-editorconfig src/
